<div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
    <table class="table border-spacing-2">
        <thead>
            <tr>
                <th>#</th>
                <th>Português</th>
                <th>Nheengatu</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of data; let i = index">
                <th>{{ i + 1 }}</th>
                <td>{{ item.portugues }}</td>
                <td>{{ item.nheengatu }}</td>
            </tr>
        </tbody>
    </table>
</div>
